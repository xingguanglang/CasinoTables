# CasinoTables - English (default language)
#
# Every player-facing string lives here. Edit freely: this file is copied into
# plugins/CasinoTables/lang/ on first start and your edits are kept across
# updates. Any key you delete falls back to the copy bundled inside the jar.
#
# Formatting uses MiniMessage: https://docs.advntr.dev/minimessage/format.html
# {placeholders} in curly braces are filled in by the plugin.

# Prefix put in front of every chat message the plugin sends.
prefix: "<gray>[<gradient:#55ffff:#aa55ff>Casino</gradient><gray>] "

help:
  header: "<gradient:#55ffff:#aa55ff>—— {brand} Casino Tables ——</gradient>"
  lines:
    - "<yellow>/casino</yellow> <gray>- open the main menu, or show controls for your current game"
    - "<yellow>/casino gui | chat</yellow> <gray>- switch between the inventory menu and the chat menu"
    - "<yellow>/casino create flight [wager] | poker | blackjack</yellow> <gray>- create a room"
    - "<yellow>/casino pieces <2|3|4></yellow> <gray>- pieces per player in Ludo"
    - "<yellow>/casino invite <player> [game] [wager]</yellow> <gray>- poker and blackjack take no fixed wager"
    - "<yellow>/casino invitepanel</yellow> <gray>- open a panel for inviting several players in a row"
    - "<yellow>/casino rooms</yellow> <gray>- join a waiting room, take a free seat, or spectate"
    - "<yellow>/casino start</yellow> <gray>- host starts the game"
    - "<yellow>/casino wager</yellow> <gray>- set the Ludo wager in chat (1-10000)"
    - "<yellow>/casino leave</yellow> <gray>- leave the table or disband your room"
    - "<yellow>/casino blinds <small> <big></yellow> <gray>- host sets the Hold'em blinds"
    - "<yellow>/casino buyin <limit></yellow> <gray>- host sets the chip carry limit"
    - "<yellow>/casino casino [1-{styles}]</yellow> <gray>- switch table decor; no argument lists them all"
    - "<yellow>/casino shape [1-4]</yellow> <gray>- switch room shape; no argument lists them all"
    - "<yellow>/casino history</yellow> <gray>- your recent Hold'em hands"
    - "<yellow>/casino bjhistory</yellow> <gray>- your recent Blackjack hands"
    - "<yellow>/casino split</yellow> <gray>- break the chip in your main hand into smaller ones"
    - "<yellow>/casino merge</yellow> <gray>- merge your chips into the largest denominations"
    - "<yellow>/casino accept|deny [player]</yellow> <gray>- accept or decline an invite"
    - "<yellow>/casino forfeit</yellow> <gray>- forfeit or fold the current game"
    - "<yellow>/casino draw</yellow> <gray>- offer or accept a draw; a 5% fee applies when everyone agrees"
  admin-lines:
    - "<yellow>/casino config set flight-time <5-600></yellow> <gray>- seconds per Ludo turn"
    - "<yellow>/casino config set poker-time <5-600></yellow> <gray>- seconds per Hold'em action"
    - "<yellow>/casino config set poker-rake <0-20></yellow> <gray>- Hold'em rake percentage, default 0.5"
    - "<yellow>/casino luck poker <player> <1-100|off></yellow> <gray>- secretly improve someone's cards"
    - "<yellow>/casino badluck poker <player> <1-100|off></yellow> <gray>- secretly worsen someone's cards"
    - "<yellow>/casino peek [player] [on|off]</yellow> <gray>- see every hole card; naming a player grants it to them"
    - "<yellow>/casino floppeek [player] [on|off]</yellow> <gray>- see undealt community cards"
    - "<yellow>/casino reload</yellow> <gray>- reload config and language files"

error:
  no-permission: "<red>You do not have permission."
  players-only: "<red>This command must be run by a player."
  unknown-game: "<red>Game must be flight, poker or blackjack."
  unknown-player: "<red>No player named \"{player}\" has ever joined this server.</red>"
  player-offline: "<red>That player is offline."
  bad-amount: "<red>\"{value}\" is not a valid amount."

config:
  reloaded: "<green>Configuration reloaded."
  reloaded-ingame: "<green>Configuration reloaded. Games already running are unaffected."
  usage:
    - "<yellow>/casino config get flight-time</yellow>"
    - "<yellow>/casino config set flight-time <5-600 seconds></yellow>"
    - "<yellow>/casino config get poker-time</yellow>"
    - "<yellow>/casino config set poker-time <5-600 seconds></yellow>"
    - "<yellow>/casino config get poker-rake</yellow>"
    - "<yellow>/casino config set poker-rake <0-20 percent></yellow>"
  flight-time:
    label: "Seconds per Ludo turn"
    current: "<green>Seconds per Ludo turn: <white>{seconds}</white>."
  poker-time:
    label: "Seconds per Hold'em action"
    current: "<green>Seconds per Hold'em action: <white>{seconds}</white>."
  poker-rake:
    current: "<green>Hold'em rake: <white>{percent}%</white>. Chips returned uncontested are not raked."
  time:
    out-of-range: "<red>Time must be between 5 and 600 seconds."
    not-a-number: "<red>Time must be a whole number of seconds."
    applied: "<green>{label} is now <white>{seconds}s</white>. Takes effect from the next game."
  rake:
    out-of-range: "<red>Rake must be between 0 and 20, given as a percentage, e.g. 0.5.</red>"
    not-a-number: "<red>Rake must be a number, e.g. /casino config set poker-rake 0.5</red>"
    applied: "<green>Hold'em rake is now <white>{percent}%</white>. Takes effect from the next hand.</green>"

luck:
  usage: "<yellow>/casino {command} poker <player> [1-100|off]</yellow>"
  unknown-game: "<red>Luck can only be set for poker.</red>"
  effect:
    good: "good luck"
    bad: "bad luck"
  pick:
    best: "best"
    worst: "worst"
  query: "<gray>{player}'s {game} {effect} weight:</gray> <yellow>{percent}%</yellow> <gray>(visible to admins only)</gray>"
  opposite-active: " <dark_gray>(the opposite effect is currently active at {percent}%)</dark_gray>"
  not-a-number: "<red>The {effect} weight must be a whole number from 1 to 100, or off.</red>"
  out-of-range: "<red>The {effect} weight must be between 1 and 100.</red>"
  cleared: "<green>Silently cleared {player}'s {game} card-luck weight.</green>"
  applied: "<green>Silently set {player}'s {game} {effect} weight to {percent}%. When it triggers, the {pick} of several random candidate hands is dealt. This replaces any opposite effect.</green>"

peek:
  name:
    hand: "hole-card peek"
    board: "community-card peek"
  detail:
    hand: "see every player's hole cards"
    board: "see Hold'em community cards before they are dealt"
  usage: "<yellow>/casino {command} [player] [on|off]</yellow>"
  offline-target: "<red>Player <yellow>{player}</yellow> is offline; {what} only applies to online players.</red>"
  self:
    enabled: "<green><bold>{what} enabled.</bold></green> <gray>You can now {detail}. Only you can see this.</gray>"
    disabled: "<yellow>{what} disabled. Hidden cards are concealed again.</yellow>"
  granted: "<green>Enabled {what} for <white>{player}</white>.</green>"
  revoked: "<yellow>Disabled {what} for <white>{player}</white>.</yellow>"
  target:
    enabled: "<green><bold>An admin enabled {what} for you.</bold></green> <gray>You can now {detail}. Only you can see this.</gray>"
    disabled: "<yellow>An admin disabled your {what}. Hidden cards are concealed again.</yellow>"

create:
  usage: "<red>Usage: /casino create <flight [wager]|poker|blackjack>"
invite:
  usage: "<red>Usage: /casino invite <player> [flight|poker|blackjack] [wager]"
  no-room: "<red>Name a game, or create a room you host first."
join:
  usage: "<red>Usage: /casino join <host></red>"
pieces:
  usage: "<red>Usage: /casino pieces <2|3|4>"
  invalid: "<red>Pieces must be 2, 3 or 4."
blinds:
  usage: "<red>Usage: /casino blinds <small> [big]  (big defaults to small x2)"
  not-a-number: "<red>Blinds must be whole numbers, e.g. /casino blinds 10"
buyin:
  usage: "<red>Usage: /casino buyin <carry limit>"
  not-a-number: "<red>The carry limit must be a whole number, e.g. /casino buyin 2000"

decor:
  list:
    header: "<gold><bold>—— Table decor ({count} total) ——</bold></gold>"
    entry: "<white>{id} {name}</white> <gray>· {description}</gray> <yellow><click:run_command:'/casino casino {id}'><hover:show_text:'Click to select'>[select]</hover></click></yellow>"
    selected: "<green><bold>✓ {id} {name}</bold></green> <gray>· {description}</gray>"
  unknown: "<red>No such decor. Use 1-{count} or a name; run /casino casino to list them all.</red>"
  classic: { name: "Royal Green", description: "Indoor luxury room; green felt with gold trim" }
  luminous: { name: "Sea Lantern", description: "Glowing lantern table under green glass" }
  nature: { name: "Open Garden", description: "Open-air garden table, no walls or roof" }
  midnight: { name: "Midnight Gold", description: "Blackstone and deepslate with gold accents" }
  crimson: { name: "Crimson Velvet", description: "Dark oak and deep red, old-school salon" }
  azure: { name: "Deep Azure", description: "Prismarine and lapis, calm blue room" }
  amethyst: { name: "Amethyst Hall", description: "Purpur pillars studded with amethyst" }
  sakura: { name: "Cherry Courtyard", description: "Open-air cherry blossom garden" }
  desert: { name: "Desert Oasis", description: "Sandstone and terracotta, warm tones" }
  nether: { name: "Nether Lava", description: "Nether brick lit by shroomlights" }
  glacier: { name: "Polar Ice", description: "Snow and blue ice under cold light" }
  copper: { name: "Steam Copper", description: "Oxidised copper and deepslate, steampunk" }
  ender: { name: "End Void", description: "End stone and purpur, otherworldly palette" }

shape:
  list:
    header: "<gold><bold>—— Room shape ({count} total) ——</bold></gold>"
    entry: "<white>{id} {name}</white> <gray>· {description}</gray> <yellow><click:run_command:'/casino shape {id}'><hover:show_text:'Click to select'>[select]</hover></click></yellow>"
    selected: "<green><bold>✓ {id} {name}</bold></green> <gray>· {description}</gray>"
    footer: "<gray>Shape and decor are independent; mix them freely.</gray>"
  unknown: "<red>No such shape. Use 1-{count} or a name; run /casino shape to list them all.</red>"
  rectangle: { name: "Rectangle", description: "Classic straight-walled room" }
  round: { name: "Round", description: "Circular hall ringed by a curved wall" }
  octagon: { name: "Octagon", description: "Corners cut off, between square and round" }
  open: { name: "Open Air", description: "Floating platform, no walls or roof, pillars at the rim" }

