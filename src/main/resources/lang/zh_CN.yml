# CasinoTables - 简体中文
#
# 所有面向玩家的文本都在这里。可以随意修改：首次启动时会复制到
# plugins/CasinoTables/lang/，之后插件升级不会覆盖你改过的内容。
# 删掉某个键会自动回落到 jar 里内置的英文版本。
#
# 格式使用 MiniMessage：https://docs.advntr.dev/minimessage/format.html
# 花括号里的 {占位符} 由插件填入。

# 插件发送的每条聊天消息前面的前缀。
prefix: "<gray>[<gradient:#55ffff:#aa55ff>赌场</gradient><gray>] "

help:
  header: "<gradient:#55ffff:#aa55ff>—— {brand} 赌场桌游 ——</gradient>"
  lines:
    - "<yellow>/casino</yellow> <gray>- 打开主菜单，或显示当前对局的操作说明"
    - "<yellow>/casino gui | chat</yellow> <gray>- 在背包菜单和聊天菜单之间切换"
    - "<yellow>/casino create flight [赌注] | poker | blackjack</yellow> <gray>- 创建房间"
    - "<yellow>/casino pieces <2|3|4></yellow> <gray>- 飞行棋每人的棋子数"
    - "<yellow>/casino invite <玩家> [游戏] [赌注]</yellow> <gray>- 德州和 21 点不收固定赌注"
    - "<yellow>/casino invitepanel</yellow> <gray>- 打开可以连续邀请多人的面板"
    - "<yellow>/casino rooms</yellow> <gray>- 加入等待房间、坐进空位或旁观"
    - "<yellow>/casino start</yellow> <gray>- 房主开始游戏"
    - "<yellow>/casino wager</yellow> <gray>- 在聊天框设置飞行棋赌注（1～10000）"
    - "<yellow>/casino leave</yellow> <gray>- 离桌或解散自己的房间"
    - "<yellow>/casino blinds <小盲> <大盲></yellow> <gray>- 房主设置德州盲注"
    - "<yellow>/casino buyin <上限></yellow> <gray>- 房主设置筹码携带上限"
    - "<yellow>/casino casino [1～{styles}]</yellow> <gray>- 切换赌场装修；不带参数会列出全部"
    - "<yellow>/casino shape [1～4]</yellow> <gray>- 切换赌场轮廓；不带参数会列出全部"
    - "<yellow>/casino history</yellow> <gray>- 你最近的德州牌局"
    - "<yellow>/casino bjhistory</yellow> <gray>- 你最近的 21 点牌局"
    - "<yellow>/casino split</yellow> <gray>- 把主手里的一枚筹码等值分解"
    - "<yellow>/casino merge</yellow> <gray>- 把可用筹码合并成尽可能大的面额"
    - "<yellow>/casino accept|deny [玩家]</yellow> <gray>- 接受或拒绝邀请"
    - "<yellow>/casino forfeit</yellow> <gray>- 当前对局认输或弃牌"
    - "<yellow>/casino draw</yellow> <gray>- 申请或同意平局；全员同意后每人扣 5% 手续费"
  admin-lines:
    - "<yellow>/casino config set flight-time <5～600></yellow> <gray>- 飞行棋每回合秒数"
    - "<yellow>/casino config set poker-time <5～600></yellow> <gray>- 德州每次行动秒数"
    - "<yellow>/casino config set poker-rake <0～20></yellow> <gray>- 德州抽水百分比，默认 0.5"
    - "<yellow>/casino luck poker <玩家> <1～100|off></yellow> <gray>- 秘密提升某人的牌运"
    - "<yellow>/casino badluck poker <玩家> <1～100|off></yellow> <gray>- 秘密降低某人的牌运"
    - "<yellow>/casino peek [玩家] [on|off]</yellow> <gray>- 查看全桌底牌；带玩家名可以开给别人"
    - "<yellow>/casino floppeek [玩家] [on|off]</yellow> <gray>- 提前查看尚未发出的公牌"
    - "<yellow>/casino reload</yellow> <gray>- 重载配置和语言文件"

error:
  no-permission: "<red>你没有权限。"
  players-only: "<red>该命令需要玩家执行。"
  unknown-game: "<red>游戏只能是 flight、poker 或 blackjack。"
  unknown-player: "<red>找不到曾经进入过服务器的玩家「{player}」。</red>"
  player-offline: "<red>玩家不在线。"
  bad-amount: "<red>「{value}」不是有效金额。"

config:
  reloaded: "<green>配置已重载。"
  reloaded-ingame: "<green>配置已重载；正在进行的对局不受影响。"
  usage:
    - "<yellow>/casino config get flight-time</yellow>"
    - "<yellow>/casino config set flight-time <5～600 秒></yellow>"
    - "<yellow>/casino config get poker-time</yellow>"
    - "<yellow>/casino config set poker-time <5～600 秒></yellow>"
    - "<yellow>/casino config get poker-rake</yellow>"
    - "<yellow>/casino config set poker-rake <0～20 百分比></yellow>"
  flight-time:
    label: "飞行棋每位玩家的回合时间"
    current: "<green>当前飞行棋每位玩家的回合时间：<white>{seconds} 秒</white>。"
  poker-time:
    label: "德州每位玩家的行动时间"
    current: "<green>当前德州每位玩家的行动时间：<white>{seconds} 秒</white>。"
  poker-rake:
    current: "<green>当前德州赌场抽水：<white>{percent}%</white>。无人跟注而退回的筹码不抽水。"
  time:
    out-of-range: "<red>时间必须在 5～600 秒之间。"
    not-a-number: "<red>时间必须是整数秒。"
    applied: "<green>{label}已改为 <white>{seconds} 秒</white>；从下一场对应游戏开始生效。"
  rake:
    out-of-range: "<red>赌场抽水必须在 0～20 之间，按百分比填写，例如 0.5。</red>"
    not-a-number: "<red>抽水必须是百分比数字，例如：/casino config set poker-rake 0.5</red>"
    applied: "<green>德州赌场抽水已改为 <white>{percent}%</white>；从下一手牌开始生效。</green>"

luck:
  usage: "<yellow>/casino {command} poker <玩家> [1～100|off]</yellow>"
  unknown-game: "<red>牌运只能设置给德州。</red>"
  effect:
    good: "好运"
    bad: "差运"
  pick:
    best: "最好"
    worst: "最差"
  query: "<gray>{player} 的{game}{effect}权重：</gray><yellow>{percent}%</yellow><gray>（仅管理员可见）</gray>"
  opposite-active: " <dark_gray>（当前实际启用了相反效果 {percent}%）</dark_gray>"
  not-a-number: "<red>{effect}权重必须是 1～100 的整数，或 off。</red>"
  out-of-range: "<red>{effect}权重必须在 1～100 之间。</red>"
  cleared: "<green>已秘密关闭 {player} 的{game}牌运权重。</green>"
  applied: "<green>已秘密设置 {player} 的{game}{effect}权重为 {percent}%；命中时会从多组随机候选牌中取{pick}的一组。设置该效果会覆盖原来的相反效果。</green>"

peek:
  name:
    hand: "看牌"
    board: "看公牌"
  detail:
    hand: "可看到全桌玩家的底牌"
    board: "可提前看到德州尚未发出的翻牌、转牌和河牌"
  usage: "<yellow>/casino {command} [玩家] [on|off]</yellow>"
  offline-target: "<red>玩家 <yellow>{player}</yellow> 不在线；{what}开关只对在线玩家生效。</red>"
  self:
    enabled: "<green><bold>{what}已开启。</bold></green> <gray>你现在{detail}；仅你可见。</gray>"
    disabled: "<yellow>{what}已关闭，隐藏的牌已立即恢复。</yellow>"
  granted: "<green>已为 <white>{player}</white> 开启{what}。</green>"
  revoked: "<yellow>已关闭 <white>{player}</white> 的{what}。</yellow>"
  target:
    enabled: "<green><bold>管理员为你开启了{what}。</bold></green> <gray>你现在{detail}；仅你可见。</gray>"
    disabled: "<yellow>管理员关闭了你的{what}，隐藏的牌已恢复。</yellow>"

create:
  usage: "<red>用法：/casino create <flight [赌注]|poker|blackjack>"
invite:
  usage: "<red>用法：/casino invite <玩家> [flight|poker|blackjack] [赌注]"
  no-room: "<red>请指定游戏，或先创建一个由你担任房主的房间。"
join:
  usage: "<red>用法：/casino join <房主></red>"
pieces:
  usage: "<red>用法：/casino pieces <2|3|4>"
  invalid: "<red>棋子数只能是 2、3 或 4。"
blinds:
  usage: "<red>用法：/casino blinds <小盲> [大盲]（不填大盲时自动为小盲×2）"
  not-a-number: "<red>盲注必须是整数，例如：/casino blinds 10"
buyin:
  usage: "<red>用法：/casino buyin <携带金币上限>"
  not-a-number: "<red>携带金币上限必须是整数，例如：/casino buyin 2000"

decor:
