    header: "<gold><bold>—— 赌场装修（共 {count} 种）——</bold></gold>"
    entry: "<white>{id} {name}</white> <gray>· {description}</gray> <yellow><click:run_command:'/casino casino {id}'><hover:show_text:'点击选择'>[选择]</hover></click></yellow>"
    selected: "<green><bold>✓ {id} {name}</bold></green> <gray>· {description}</gray>"
  unknown: "<red>没有这种装修；可填 1～{count} 或名称，直接输入 /casino casino 查看全部。</red>"
  classic: { name: "皇家绿毯", description: "室内豪华赌场；石英地面配黑石金边墙，经典绿桌" }
  luminous: { name: "海晶玻璃", description: "室内灯光赌场；萤石与海晶灯桌面，上覆玻璃" }
  nature: { name: "露天自然", description: "露天花园赌场；草地、原木与灯笼环绕，无墙无顶" }
  midnight: { name: "午夜黑金", description: "黑石地面、深板岩墙、黑石砖顶，配金饰与萤石" }
  crimson: { name: "绯红丝绒", description: "深板岩地面、深色橡木墙、去皮原木顶，红丝绒牌桌" }
  azure: { name: "深海蓝调", description: "海晶砖地面、暗海晶墙、海晶石顶，青金石点缀" }
  amethyst: { name: "紫晶殿堂", description: "石英地面、紫珀墙、紫珀柱顶，紫水晶点缀" }
  sakura: { name: "樱花庭院", description: "露天樱花庭院；苔藓地面、樱花木与粉樱，无墙无顶" }
  desert: { name: "沙漠绿洲", description: "平滑沙岩地面、切制沙岩墙、普通沙岩顶，暖色调" }
  nether: { name: "地狱熔岩", description: "下界砖地面、红色下界砖墙、雕纹下界砖顶，菌光体照明" }
  glacier: { name: "极地冰宫", description: "雪块地面、浮冰墙、蓝冰顶，冷白灯光" }
  copper: { name: "蒸汽铜殿", description: "深板岩地面、切制铜墙、氧化铜顶，蒸汽朋克风" }
  ender: { name: "末地虚空", description: "末地石砖地面、紫珀墙、末地石顶，异界配色" }

shape:
  list:
    header: "<gold><bold>—— 赌场轮廓（共 {count} 种）——</bold></gold>"
    entry: "<white>{id} {name}</white> <gray>· {description}</gray> <yellow><click:run_command:'/casino shape {id}'><hover:show_text:'点击选择'>[选择]</hover></click></yellow>"
    selected: "<green><bold>✓ {id} {name}</bold></green> <gray>· {description}</gray>"
    footer: "<gray>轮廓与装修是两个独立设置，可以任意搭配。</gray>"
  unknown: "<red>没有这种轮廓；可填 1～{count} 或名称，直接输入 /casino shape 查看全部。</red>"
  rectangle: { name: "方形", description: "四面直墙的经典包间" }
  round: { name: "圆形", description: "环形外墙围成的圆厅，中央圆桌" }
  octagon: { name: "八边形", description: "切掉四角的八边形大厅，介于方与圆之间" }
  open: { name: "开放式", description: "悬空圆台，无墙无顶，只在边缘立一圈柱子" }

